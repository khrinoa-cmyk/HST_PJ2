<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=yes, minimum-scale=0.5, maximum-scale=5, viewport-fit=cover"/>
  <title>조합원용 실시간 시트 뷰어 (전체 맞춤 고정)</title>
  <style>
    html, body {
      margin:0; padding:0;
      width:100%; height:100%;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background:#fff;
      touch-action: pan-x pan-y pinch-zoom;
    }
    /* 주소창 변화에도 안정적인 높이를 위해 100dvh 사용 */
    .wrap {
      position:relative; width:100%; height:100dvh;
      overflow:hidden; background:#fff;
    }
    .zoomLayer { position:relative; width:100%; height:100%; }
    /* 스케일을 실제로 거는 레이어 */
    .scaled {
      position:absolute; top:0; left:0;
      transform-origin: 0 0;
      background:#fff;
    }
    iframe.viewer {
      position:absolute; inset:0; width:100%; height:100%;
      border:0; background:#fff; transition:opacity .25s ease;
    }
    .panel {
      position:fixed; left:8px; bottom:8px; z-index:10;
      display:flex; gap:8px; align-items:center;
      background:#fffccfdd; backdrop-filter: blur(4px);
      padding:6px 10px; border-radius:10px; box-shadow:0 2px 10px #0002;
      font-size:12px;
    }
    .btn { cursor:pointer; border:1px solid #ddd; background:#fff; padding:6px 10px; border-radius:8px; }
    .btn:hover { background:#f5f5f5; }
    .note { opacity:.75 }
  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="zoomLayer" id="zoomLayer">
      <div class="scaled" id="scaled">
        <!-- 더블버퍼: 깜빡임 없이 새로고침 -->
        <iframe id="frameA" class="viewer" title="Excel Viewer A"></iframe>
        <iframe id="frameB" class="viewer" title="Excel Viewer B" style="opacity:0"></iframe>
      </div>
    </div>
  </div>

  <div class="panel">
    <button class="btn" id="manualRefresh">새로고침</button>
    <span class="note" id="status">상태: 준비중</span>
  </div>

  <script>
    /** ===================== 임베드 설정 ===================== */
    // 가능하면 1drv.ms 단축링크 말고 onedrive.live.com/embed?… 또는 sharepoint …?embed=1 를 쓰세요.
    const preferredEmbedUrl = ""; // 예: "https://onedrive.live.com/embed?resid=...&authkey=...&em=2"
    const fallbackShortUrl  = "https://1drv.ms/x/c/265c571b25332f3d/IQRYabtwWH1lQLYgLDJn5Nt8ASyHGrA-012f9XXwOlWf1ec";

    // 공유 범위 (특수문자 시트명은 작은따옴표로 감싸기)
    // 예: "'★참석집계★'!B3:R42"  또는  "Print_Area"
    const SHARE_RANGE = "'★참석집계★'!B3:R42";

    // 상호작용이 꼭 필요 없으면 False로 (스냅샷처럼 더 안정적으로 맞춰짐)
    const INTERACTIVE = false;

    const VIEW_OPTIONS = {
      em: "2",
      wdAllowInteractivity: INTERACTIVE ? "True" : "False",
      wdHideGridlines: "True",
      wdHideHeaders: "True",
      wdHideSheetTabs: "True",
      wdDownloadButton: "False"
    };

    function buildEmbedUrl() {
      const base = preferredEmbedUrl || fallbackShortUrl;
      const params = new URLSearchParams(VIEW_OPTIONS);
      if (SHARE_RANGE) params.set("Item", SHARE_RANGE);
      const sep = base.includes("?") ? "&" : "?";
      return base + sep + params.toString();
    }

    /** ===================== 로드/새로고침(더블버퍼) ===================== */
    const frameA = document.getElementById("frameA");
    const frameB = document.getElementById("frameB");
    const statusEl = document.getElementById("status");
    const setStatus = (t)=> statusEl.textContent = "상태: " + t;

    (function initialLoad(){
      const url = buildEmbedUrl();
      setStatus("로드 중…");
      let a=false, b=false;
      frameA.onload = ()=>{ a=true; if(b) setStatus("완료"); };
      frameB.onload = ()=>{ b=true; if(a) setStatus("완료"); };
      frameA.src = url; frameB.src = url;
    })();

    document.getElementById("manualRefresh").addEventListener("click", () => {
      const base = buildEmbedUrl();
      const url  = base + (base.includes("?") ? "&" : "?") + "t=" + Date.now();
      const front = (getComputedStyle(frameA).opacity !== "0") ? frameA : frameB;
      const back  = (front === frameA) ? frameB : frameA;
      setStatus("새로고침 중…");
      back.onload = () => { back.style.opacity = "1"; front.style.opacity = "0"; back.onload = null; setStatus("완료"); };
      back.src = url;
    });

    /** ===================== 전체 맞춤 고정 로직 ===================== */
    const wrapEl   = document.getElementById("wrap");
    const zoomLayer= document.getElementById("zoomLayer");
    const scaledEl = document.getElementById("scaled");

    // ▼ 셀 폭/높이 추정값(픽셀). 범위의 열너비/행높이가 기본값과 다르면 여기서 미세조정하세요.
    //    세로가 더 크게 느껴지면 CELL_H를 1~2px 늘리고, 작으면 줄이면 됩니다.
    const CELL_W = 64;   // 기본 열 폭 근사치
    const CELL_H = 22;   // 기본 행 높이 근사치
    const EXTRA_PADDING = 16; // 테두리/여백 보정

    // '시트!B3:R42' → {cols, rows}
    function colToNum(col){ let n=0; for(const c of col.toUpperCase()) n = n*26 + (c.charCodeAt(0)-64); return n; }
    function parseA1(a1){
      const m = a1.match(/!([A-Za-z]+)(\d+)\s*:\s*([A-Za-z]+)(\d+)/);
      if(!m) return null;
      const c1 = colToNum(m[1]), r1 = +m[2];
      const c2 = colToNum(m[3]), r2 = +m[4];
      return { cols: Math.abs(c2-c1)+1, rows: Math.abs(r2-r1)+1 };
    }

    // 스케일 1.0 기준의 "콘텐츠 실제 픽셀 크기"를 추정
    function getContentBaseSize(){
      const pr = parseA1(SHARE_RANGE || "");
      if (!pr) return { w: wrapEl.clientWidth, h: wrapEl.clientHeight };
      const w = pr.cols * CELL_W + EXTRA_PADDING;
      const h = pr.rows * CELL_H + EXTRA_PADDING;
      return { w, h };
    }

    function fitAllFixed(){
      const { w:baseW, h:baseH } = getContentBaseSize();
      // 가용 영역(패널 높이만큼 빼서 계산)
      const panel = document.querySelector('.panel');
      const availW = wrapEl.clientWidth;
      const availH = Math.max(100, wrapEl.clientHeight - (panel?.offsetHeight || 0) - 12);

      const scale = Math.min(availW / baseW, availH / baseH);
      // 스케일 적용
      scaledEl.style.width  = baseW + "px";
      scaledEl.style.height = baseH + "px";
      scaledEl.style.transform = `scale(${scale})`;
      // 스크롤 영역도 동일 크기로 설정
      zoomLayer.style.width  = Math.round(baseW * scale) + "px";
      zoomLayer.style.height = Math.round(baseH * scale) + "px";
      // 좌상단 정렬(필요시 가운데 정렬 하려면 아래 두 줄 대신 margin으로 중앙정렬 처리)
      wrapEl.scrollTo({left:0, top:0, behavior:"auto"});
    }

    // 최초/리사이즈 때 항상 전체 맞춤 유지
    fitAllFixed();
    let rTimer=null;
    window.addEventListener("resize", () => {
      clearTimeout(rTimer);
      rTimer = setTimeout(fitAllFixed, 120);
    });
  </script>
</body>
</html>
